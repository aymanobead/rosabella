<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3e5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#bg4)"/>
  <!-- Soft border -->
  <rect x="18" y="18" width="964" height="764" fill="none" stroke="#ad1457" stroke-width="2.5" rx="6"/>
  <rect x="30" y="30" width="940" height="740" fill="none" stroke="#f8bbd0" stroke-width="1.5" rx="4"/>
  <!-- Rose cluster top-left -->
  <g transform="translate(80,80)">
    <circle cx="0" cy="0" r="30" fill="#f48fb1" opacity="0.7"/>
    <circle cx="0" cy="0" r="20" fill="#e91e63" opacity="0.8"/>
    <circle cx="0" cy="0" r="10" fill="#880e4f"/>
    <ellipse cx="-35" cy="10" rx="20" ry="12" fill="#a5d6a7" opacity="0.8" transform="rotate(-30,-35,10)"/>
    <ellipse cx="35" cy="10" rx="20" ry="12" fill="#a5d6a7" opacity="0.8" transform="rotate(30,35,10)"/>
    <ellipse cx="0" cy="35" rx="22" ry="12" fill="#c8e6c9" opacity="0.7"/>
  </g>
  <!-- Rose cluster top-right -->
  <g transform="translate(920,80)">
    <circle cx="0" cy="0" r="28" fill="#f48fb1" opacity="0.7"/>
    <circle cx="0" cy="0" r="18" fill="#e91e63" opacity="0.8"/>
    <circle cx="0" cy="0" r="9" fill="#880e4f"/>
    <ellipse cx="-32" cy="8" rx="18" ry="10" fill="#a5d6a7" opacity="0.8" transform="rotate(-30,-32,8)"/>
    <ellipse cx="32" cy="8" rx="18" ry="10" fill="#a5d6a7" opacity="0.8" transform="rotate(30,32,8)"/>
  </g>
  <!-- Bottom left/right flowers -->
  <g transform="translate(80,720)">
    <circle cx="0" cy="0" r="25" fill="#f06292" opacity="0.6"/>
    <circle cx="0" cy="0" r="15" fill="#e91e63" opacity="0.7"/>
    <circle cx="0" cy="0" r="7" fill="#880e4f"/>
  </g>
  <g transform="translate(920,720)">
    <circle cx="0" cy="0" r="25" fill="#f06292" opacity="0.6"/>
    <circle cx="0" cy="0" r="15" fill="#e91e63" opacity="0.7"/>
    <circle cx="0" cy="0" r="7" fill="#880e4f"/>
  </g>
  <!-- Scattered petals -->
  <g opacity="0.2" fill="#e91e63">
    <ellipse cx="200" cy="760" rx="30" ry="12" transform="rotate(-20,200,760)"/>
    <ellipse cx="800" cy="760" rx="28" ry="11" transform="rotate(20,800,760)"/>
    <ellipse cx="500" cy="770" rx="35" ry="12"/>
  </g>
  <!-- Dividers -->
  <line x1="100" y1="205" x2="900" y2="205" stroke="#ad1457" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="650" x2="900" y2="650" stroke="#ad1457" stroke-width="0.8" opacity="0.4"/>
  <!-- Heart watermark center -->
  <path d="M500,430 C500,430 540,390 570,390 C600,390 620,410 620,430 C620,470 500,530 500,530 C500,530 380,470 380,430 C380,410 400,390 430,390 C460,390 500,430 500,430 Z" fill="#e91e63" opacity="0.04"/>
</svg>
