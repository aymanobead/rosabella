<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#bg2)"/>
  <!-- Festive border -->
  <rect x="15" y="15" width="970" height="770" fill="none" stroke="#9c27b0" stroke-width="3" rx="12"/>
  <rect x="28" y="28" width="944" height="744" fill="none" stroke="#ce93d8" stroke-width="1.5" rx="8"/>
  <!-- Stars/confetti scattered -->
  <g fill="#ffd700" opacity="0.7">
    <polygon points="60,40 63,55 78,55 66,64 70,79 60,70 50,79 54,64 42,55 57,55" transform="scale(0.5) translate(60,40)"/>
    <polygon points="930,40 933,55 948,55 936,64 940,79 930,70 920,79 924,64 912,55 927,55" transform="scale(0.5) translate(800,40)"/>
    <polygon points="60,740 63,755 78,755 66,764 70,779 60,770 50,779 54,764 42,755 57,755" transform="scale(0.5) translate(60,700)"/>
    <polygon points="930,740 933,755 948,755 936,764 940,779 930,770 920,779 924,764 912,755 927,755" transform="scale(0.5) translate(800,700)"/>
  </g>
  <!-- Balloons top -->
  <g opacity="0.7">
    <ellipse cx="160" cy="80" rx="35" ry="45" fill="#ef5350"/>
    <line x1="160" y1="125" x2="155" y2="150" stroke="#ef5350" stroke-width="1.5"/>
    <ellipse cx="840" cy="80" rx="35" ry="45" fill="#42a5f5"/>
    <line x1="840" y1="125" x2="845" y2="150" stroke="#42a5f5" stroke-width="1.5"/>
    <ellipse cx="500" cy="55" rx="28" ry="38" fill="#ffd740"/>
    <line x1="500" y1="93" x2="500" y2="115" stroke="#ffd740" stroke-width="1.5"/>
  </g>
  <!-- Happy Birthday top banner area -->
  <rect x="200" y="90" width="600" height="5" fill="#9c27b0" opacity="0.3" rx="3"/>
  <!-- Confetti dots -->
  <g opacity="0.5">
    <circle cx="80" cy="200" r="5" fill="#ef5350"/>
    <circle cx="920" cy="200" r="5" fill="#42a5f5"/>
    <circle cx="80" cy="600" r="5" fill="#66bb6a"/>
    <circle cx="920" cy="600" r="5" fill="#ffd740"/>
    <rect x="100" y="350" width="8" height="8" fill="#ef5350" transform="rotate(30,104,354)"/>
    <rect x="890" y="350" width="8" height="8" fill="#9c27b0" transform="rotate(45,894,354)"/>
  </g>
  <!-- Dividers -->
  <line x1="100" y1="215" x2="900" y2="215" stroke="#9c27b0" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="635" x2="900" y2="635" stroke="#9c27b0" stroke-width="0.8" opacity="0.4"/>
  <!-- Bottom cake/celebration -->
  <g transform="translate(500,770)" opacity="0.4">
    <rect x="-60" y="-25" width="120" height="20" fill="#ce93d8" rx="3"/>
    <rect x="-45" y="-40" width="90" height="18" fill="#f48fb1" rx="3"/>
    <line x1="-20" y1="-45" x2="-20" y2="-55" stroke="#ffd740" stroke-width="2"/>
    <line x1="0" y1="-42" x2="0" y2="-52" stroke="#ef5350" stroke-width="2"/>
    <line x1="20" y1="-45" x2="20" y2="-55" stroke="#42a5f5" stroke-width="2"/>
    <circle cx="-20" cy="-57" r="3" fill="#ffd740"/>
    <circle cx="0" cy="-54" r="3" fill="#ef5350"/>
    <circle cx="20" cy="-57" r="3" fill="#42a5f5"/>
  </g>
</svg>
