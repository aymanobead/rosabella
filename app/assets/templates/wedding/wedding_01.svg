<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5e6cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1000" height="800" fill="url(#bg)"/>
  <!-- Outer border -->
  <rect x="20" y="20" width="960" height="760" fill="none" stroke="url(#border)" stroke-width="3"/>
  <!-- Inner border -->
  <rect x="35" y="35" width="930" height="730" fill="none" stroke="#c9a84c" stroke-width="1" stroke-dasharray="8,4"/>
  <!-- Top decorative roses -->
  <g transform="translate(500,60)">
    <circle cx="0" cy="0" r="22" fill="#e8c4a0" opacity="0.8"/>
    <circle cx="0" cy="0" r="14" fill="#d4956a" opacity="0.9"/>
    <circle cx="0" cy="0" r="7" fill="#b87048"/>
    <ellipse cx="-30" cy="5" rx="18" ry="10" fill="#c8e6c9" opacity="0.7" transform="rotate(-30,-30,5)"/>
    <ellipse cx="30" cy="5" rx="18" ry="10" fill="#c8e6c9" opacity="0.7" transform="rotate(30,30,5)"/>
    <ellipse cx="-50" cy="-5" rx="15" ry="8" fill="#a5d6a7" opacity="0.6" transform="rotate(-50,-50,-5)"/>
    <ellipse cx="50" cy="-5" rx="15" ry="8" fill="#a5d6a7" opacity="0.6" transform="rotate(50,50,-5)"/>
  </g>
  <!-- Corner ornaments -->
  <g opacity="0.6">
    <path d="M 50 50 Q 80 50 80 80" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <path d="M 50 50 Q 50 80 80 80" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <circle cx="50" cy="50" r="4" fill="#c9a84c"/>
    <path d="M 950 50 Q 920 50 920 80" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <path d="M 950 50 Q 950 80 920 80" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <circle cx="950" cy="50" r="4" fill="#c9a84c"/>
    <path d="M 50 750 Q 80 750 80 720" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <path d="M 50 750 Q 50 720 80 720" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <circle cx="50" cy="750" r="4" fill="#c9a84c"/>
    <path d="M 950 750 Q 920 750 920 720" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <path d="M 950 750 Q 950 720 920 720" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <circle cx="950" cy="750" r="4" fill="#c9a84c"/>
  </g>
  <!-- Title area top line -->
  <line x1="150" y1="115" x2="450" y2="115" stroke="#c9a84c" stroke-width="1" opacity="0.8"/>
  <line x1="550" y1="115" x2="850" y2="115" stroke="#c9a84c" stroke-width="1" opacity="0.8"/>
  <circle cx="500" cy="115" r="3" fill="#c9a84c" opacity="0.8"/>
  <!-- Bottom floral strip -->
  <g transform="translate(0,740)">
    <ellipse cx="200" cy="0" rx="60" ry="18" fill="#f8d7da" opacity="0.5"/>
    <ellipse cx="500" cy="0" rx="80" ry="20" fill="#f8d7da" opacity="0.5"/>
    <ellipse cx="800" cy="0" rx="60" ry="18" fill="#f8d7da" opacity="0.5"/>
  </g>
  <!-- Divider lines around text area -->
  <line x1="100" y1="210" x2="900" y2="210" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
  <line x1="100" y1="650" x2="900" y2="650" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
  <!-- Subtle watermark flowers -->
  <g opacity="0.08">
    <circle cx="150" cy="400" r="80" fill="#c9a84c"/>
    <circle cx="850" cy="400" r="80" fill="#c9a84c"/>
  </g>
</svg>
