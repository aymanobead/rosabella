<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0010;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d0020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0010;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c2185b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1a0010;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#bg5)"/>
  <!-- Central glow -->
  <rect width="1000" height="800" fill="url(#glow)"/>
  <!-- Gold border -->
  <rect x="18" y="18" width="964" height="764" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
  <rect x="28" y="28" width="944" height="744" fill="none" stroke="#8b6914" stroke-width="1" stroke-dasharray="6,3"/>
  <!-- Large heart background -->
  <path d="M500,420 C500,420 580,340 640,340 C700,340 740,380 740,420 C740,500 500,590 500,590 C500,590 260,500 260,420 C260,380 300,340 360,340 C420,340 500,420 500,420 Z" fill="#c2185b" opacity="0.12"/>
  <!-- Rose top center -->
  <g transform="translate(500,65)">
    <circle cx="0" cy="0" r="28" fill="#b71c1c" opacity="0.9"/>
    <circle cx="0" cy="0" r="18" fill="#d32f2f" opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="#f44336"/>
    <circle cx="0" cy="0" r="5" fill="#c62828"/>
    <!-- Petals -->
    <ellipse cx="-32" cy="-8" rx="18" ry="9" fill="#b71c1c" opacity="0.8" transform="rotate(-40,-32,-8)"/>
    <ellipse cx="32" cy="-8" rx="18" ry="9" fill="#b71c1c" opacity="0.8" transform="rotate(40,32,-8)"/>
    <ellipse cx="-20" cy="28" rx="16" ry="9" fill="#1b5e20" opacity="0.7" transform="rotate(-20,-20,28)"/>
    <ellipse cx="20" cy="28" rx="16" ry="9" fill="#1b5e20" opacity="0.7" transform="rotate(20,20,28)"/>
  </g>
  <!-- Small roses corners -->
  <g transform="translate(80,80)" opacity="0.8">
    <circle cx="0" cy="0" r="18" fill="#b71c1c"/>
    <circle cx="0" cy="0" r="10" fill="#e53935"/>
    <circle cx="0" cy="0" r="5" fill="#c62828"/>
  </g>
  <g transform="translate(920,80)" opacity="0.8">
    <circle cx="0" cy="0" r="18" fill="#b71c1c"/>
    <circle cx="0" cy="0" r="10" fill="#e53935"/>
    <circle cx="0" cy="0" r="5" fill="#c62828"/>
  </g>
  <g transform="translate(80,720)" opacity="0.8">
    <circle cx="0" cy="0" r="18" fill="#b71c1c"/>
    <circle cx="0" cy="0" r="10" fill="#e53935"/>
    <circle cx="0" cy="0" r="5" fill="#c62828"/>
  </g>
  <g transform="translate(920,720)" opacity="0.8">
    <circle cx="0" cy="0" r="18" fill="#b71c1c"/>
    <circle cx="0" cy="0" r="10" fill="#e53935"/>
    <circle cx="0" cy="0" r="5" fill="#c62828"/>
  </g>
  <!-- Gold sparkles -->
  <g fill="#c9a84c" opacity="0.5">
    <circle cx="200" cy="400" r="2"/>
    <circle cx="800" cy="400" r="2"/>
    <circle cx="150" cy="300" r="1.5"/>
    <circle cx="850" cy="300" r="1.5"/>
    <circle cx="150" cy="500" r="1.5"/>
    <circle cx="850" cy="500" r="1.5"/>
  </g>
  <!-- Dividers -->
  <line x1="100" y1="215" x2="900" y2="215" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
  <line x1="100" y1="655" x2="900" y2="655" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
